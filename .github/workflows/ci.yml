name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装（生产代码零依赖，这里装的是测试用的真对端）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: 单元测试 — 协议与配置
        run: python -m pytest tests/unit -q

      - name: 端到端 — 真实 aiocqhttp 当 AstrBot 侧
        run: python tests/e2e/relay_test.py

      - name: 端到端 — 文档里那条命令（子进程）
        run: python tests/e2e/cli_test.py

      - name: 端到端 — 上游换成真的 ArkLink 服务端
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/panxian-AI/ArkLink.git ../ArkLink
          ARKLINK_PATH=../ArkLink python tests/e2e/arklink_real_test.py

      - name: 语法检查
        run: python -m compileall -q arkbridge tests
